<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Подснежник</title>
<meta name="theme-color" content="#eef2f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Подснежник">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Ежедневник «Подснежник»: морозный светлый фон, хвойные чернила, зелень стебля как акцент.
   Сетка: шапка с датой и вкладками → две колонки (дела | ритм и дневник), на телефоне одна. */
:root {
  --bg: #eef2f1;
  --surface: #ffffff;
  --ink: #15211d;
  --muted: #5d6b66;
  --line: #d8e0dd;
  --accent: #2c7a57;
  --accent-soft: #e2efe8;
  --good: #2c7a57;
  --warn: #b7791f;
  --bad: #b4443a;
  --bad-soft: #f6e4e1;
  --warn-soft: #f7edda;
  --font-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --font-body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1412; --surface: #151d1a; --ink: #e5ece9; --muted: #93a29c; --line: #26322d;
    --accent: #6cc597; --accent-soft: #1b2c24; --good: #6cc597; --warn: #e0a84e; --bad: #e57a6f;
    --bad-soft: #2e1c1a; --warn-soft: #2d2416; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1412; --surface: #151d1a; --ink: #e5ece9; --muted: #93a29c; --line: #26322d;
  --accent: #6cc597; --accent-soft: #1b2c24; --good: #6cc597; --warn: #e0a84e; --bad: #e57a6f;
  --bad-soft: #2e1c1a; --warn-soft: #2d2416; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-body); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 20px 20px 48px; display: grid; gap: 20px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }

/* Шапка */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -0.01em; }
.brand svg { width: 30px; height: 30px; flex: none; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs a { text-decoration: none; color: var(--muted); padding: 6px 14px; border-radius: 999px; font-weight: 500; font-size: 14px; }
.tabs a[aria-current="page"] { background: var(--ink); color: var(--surface); }
.status { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-s="ok"]::before { background: var(--good); }
.status[data-s="busy"]::before { background: var(--warn); }
.status[data-s="err"]::before { background: var(--bad); }

/* Заголовок дня */
.dayhead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; }
.dayhead h2 { font-family: var(--font-display); font-weight: 500; font-size: clamp(22px, 3.4vw, 30px); letter-spacing: -0.015em; }
.dayhead .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
.nav { display: flex; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 12px; cursor: pointer; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0e1412; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0e1412; } }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); border-color: var(--line); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.pill b { color: var(--ink); font-weight: 600; }
.pill.good { background: var(--accent-soft); border-color: transparent; }
.pill.good b { color: var(--good); }

/* Карточки */
.grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 20px; align-items: start; }
.col { display: grid; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 18px 16px; display: grid; gap: 12px; }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 10px; }
.card-h h3 { font-size: 15px; font-weight: 600; }
.card-h .meta { font-size: 13px; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); margin: 0; }

/* Чекбоксы */
input[type="checkbox"] { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; border: 1.5px solid var(--muted); border-radius: 6px; margin: 0; flex: none; cursor: pointer; display: grid; place-content: center; background: var(--surface); }
input[type="checkbox"]::after { content: ""; width: 10px; height: 6px; border-left: 2px solid transparent; border-bottom: 2px solid transparent; transform: rotate(-45deg) translate(1px, -1px); }
input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
input[type="checkbox"]:checked::after { border-color: var(--surface); }

/* Три главных */
.top3 { display: grid; gap: 8px; }
.top-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: var(--bg); }
.top-row .n { font-family: var(--font-display); font-size: 13px; color: var(--muted); width: 14px; }
.top-row input[type="text"] { flex: 1; border: 0; background: transparent; padding: 2px 0; min-width: 0; }
.top-row input[type="text"]:focus { outline: none; }
.top-row.done input[type="text"] { text-decoration: line-through; color: var(--muted); }

/* Задачи */
.add { display: flex; gap: 8px; }
.add input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 12px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; }
.task { display: flex; align-items: center; gap: 10px; padding: 9px 2px; border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.task .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.task.done .t { text-decoration: line-through; color: var(--muted); }
.task.moved { opacity: .55; }
.task .acts { display: flex; gap: 2px; opacity: .55; }
.task:hover .acts, .task:focus-within .acts { opacity: 1; }
.icon { border: 0; background: transparent; cursor: pointer; color: var(--muted); padding: 4px 6px; border-radius: 8px; font-size: 13px; }
.icon:hover { background: var(--bg); color: var(--ink); }
.prio { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; cursor: pointer; padding: 0; background: transparent; }
.prio.on { background: var(--bad); border-color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

/* Ритм */
.habits { display: grid; gap: 6px; }
.habit { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); }
.habit.planned { border-left: 3px solid var(--accent); }
.habit.done { background: var(--accent-soft); border-color: transparent; }
.habit.done.planned { border-left-color: var(--accent); }
.habit .name { font-weight: 500; }
.habit .sub { font-size: 12.5px; color: var(--muted); }
.tag { font-size: 11.5px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.metric { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.metric input { width: 64px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }

/* Дневник */
.scales { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.scale { display: grid; gap: 6px; }
.scale .lbl { font-size: 13px; color: var(--muted); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 0; cursor: pointer; font-variant-numeric: tabular-nums; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.field { display: grid; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); }
.field textarea { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 9px 12px; resize: vertical; min-height: 64px; line-height: 1.45; }

/* Неделя */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 4px; border-top: 3px solid var(--line); }
.tile.good { border-top-color: var(--good); }
.tile.warn { border-top-color: var(--warn); }
.tile.bad { border-top-color: var(--bad); }
.tile .k { font-size: 13px; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.tile .v small { font-family: var(--font-body); font-size: 14px; color: var(--muted); font-weight: 400; }
.tile .t { font-size: 12.5px; color: var(--muted); }
.tablewrap { overflow-x: auto; }
table.wk { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 14px; }
table.wk th, table.wk td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--line); }
table.wk th:first-child, table.wk td:first-child { text-align: left; padding-left: 0; }
table.wk thead th { font-weight: 500; color: var(--muted); font-size: 13px; }
table.wk thead th button { border: 0; background: transparent; cursor: pointer; color: inherit; font: inherit; padding: 2px 6px; border-radius: 6px; }
table.wk thead th button:hover { background: var(--bg); color: var(--ink); }
table.wk thead th.today button { background: var(--ink); color: var(--surface); }
.dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; }
.dot.done { background: var(--accent); }
.dot.miss { border: 1.5px solid var(--bad); }
.dot.plan { border: 1.5px solid var(--muted); }
.dot.none { width: 4px; height: 4px; background: var(--line); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.notes { display: grid; gap: 10px; }
.note { display: grid; grid-template-columns: 70px 1fr; gap: 10px; font-size: 14px; }
.note .d { color: var(--muted); font-variant-numeric: tabular-nums; }
.note p { margin: 0; }
.note .lab { color: var(--muted); }
.report { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px 12px; font: 13px/1.5 var(--font-body); }

/* Цели */
.bar { height: 8px; border-radius: 999px; background: var(--bg); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.goal { display: grid; gap: 6px; }
.goal .row { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.goal .row span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.ladder { list-style: none; margin: 0; padding: 0; display: grid; }
.ladder li { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
.ladder li:first-child { border-top: 0; }
.ladder .y { font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.ladder .age { font-size: 12.5px; color: var(--muted); }
.ladder .role { font-weight: 600; }
.ladder .det { font-size: 13.5px; color: var(--muted); }
.ladder li.now .y { color: var(--accent); }
.rules { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
a { color: var(--accent); }

/* Финансы */
.big { font-family: var(--font-display); font-weight: 500; font-size: clamp(26px, 4vw, 34px); letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.up { color: var(--good); }
.down { color: var(--bad); }
table.pf { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 14px; font-variant-numeric: tabular-nums; }
table.pf th { font-weight: 500; color: var(--muted); font-size: 12.5px; text-align: right; padding: 0 8px 8px; white-space: nowrap; }
table.pf td { padding: 8px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
table.pf th:first-child, table.pf td:first-child { text-align: left; padding-left: 0; }
table.pf td:last-child, table.pf th:last-child { padding-right: 0; }
table.pf .tk { font-weight: 600; }
table.pf .nm { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
table.pf input { width: 92px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; background: var(--bg); text-align: right; font-variant-numeric: tabular-nums; }
table.pf input.qty { width: 76px; }
table.pf tfoot td { font-weight: 600; border-top: 1.5px solid var(--ink); }
.alloc { display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; background: var(--bg); }
.alloc i { display: block; height: 100%; }
.alloc-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.alloc-legend span { display: inline-flex; align-items: center; gap: 6px; }
.alloc-legend i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; }
.addrow input, .addrow select { border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; background: var(--bg); font: inherit; color: inherit; }
.addrow input { width: 160px; text-transform: uppercase; }
.divs { list-style: none; margin: 0; padding: 0; display: grid; }
.divs li { display: grid; grid-template-columns: 92px 1fr auto; gap: 4px 12px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.divs li:first-child { border-top: 0; }
.divs .when { font-weight: 600; }
.divs .what { font-size: 14px; }
.divs .what small { display: block; color: var(--muted); font-size: 12.5px; }
.divs .sum { font-weight: 600; text-align: right; }
.chip { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; margin-left: 6px; font-weight: 500; }
.chip.decl { background: var(--accent-soft); color: var(--accent); }
.chip.fc { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }
.mrow { display: grid; grid-template-columns: 1fr 120px auto; gap: 8px; align-items: center; }
.mrow input { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: var(--bg); min-width: 0; }
.mrow input.amt { text-align: right; font-variant-numeric: tabular-nums; }
.mrow .lbl { font-size: 14px; }
.mgrid { display: grid; gap: 6px; }
.stale { color: var(--warn); }
.banner { padding: 10px 14px; border-radius: 10px; background: var(--warn-soft); font-size: 13.5px; }
[hidden] { display: none !important; }

/* Журнал расходов */
.sp-card { gap: 14px; }
.sp-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px 20px; }
.sp-top .k { font-size: 13px; color: var(--muted); }
.sp-top .big { color: var(--ink); }
.sp-top .t { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sp-add { display: grid; grid-template-columns: 150px 1fr 1.3fr 140px auto; gap: 8px; }
.sp-add input, .sp-add select { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); font: inherit; color: inherit; min-width: 0; }
.sp-add input.amt { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; font-size: 16px; }
.sp-add .btn { padding: 9px 16px; }
.sp-add input.amt::-webkit-inner-spin-button, .sp-add input.amt::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.sp-add input.amt { -moz-appearance: textfield; appearance: textfield; }
.sp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.sp-chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; cursor: pointer; color: var(--muted); }
.sp-chips button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.sp-body { display: grid; grid-template-columns: 1fr 1.2fr; gap: 20px; align-items: start; }
.sp-cats { display: grid; gap: 2px; }
.sp-cat { all: unset; box-sizing: border-box; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 7px 8px; border-radius: 10px; font-size: 14px; }
.sp-cat:hover { background: var(--bg); }
.sp-cat:focus-visible { outline: 2px solid var(--accent); }
.sp-cat[aria-pressed="true"] { background: var(--accent-soft); }
.sp-cat .s { font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.sp-cat .s small { font-weight: 400; color: var(--muted); margin-left: 6px; }
.sp-cat .bar { grid-column: 1 / -1; height: 5px; }
.sp-cat.zero { color: var(--muted); }
.sp-log { list-style: none; margin: 0; padding: 0; display: grid; }
.sp-log .dh { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 10px 0 4px; font-variant-numeric: tabular-nums; }
.sp-log .dh:first-child { padding-top: 0; }
.sp-log .it { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
.sp-log .it .w small { display: block; font-size: 12px; color: var(--muted); }
.sp-log .it .a { font-weight: 600; font-variant-numeric: tabular-nums; }
.sp-log .it.new { animation: spNew 1.2s ease; }
@keyframes spNew { from { background: var(--accent-soft); } to { background: transparent; } }
@media (max-width: 820px) { .sp-body { grid-template-columns: 1fr; } .sp-add { grid-template-columns: 1fr 1fr; } .sp-add .btn { grid-column: 1 / -1; } }

/* Индекс Мосбиржи */
.idx { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.idx b { color: var(--bad); font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.idx .live { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); align-self: center; }
@media (prefers-reduced-motion: no-preference) { .idx .live { animation: idxPulse 2s ease-in-out infinite; } }
@keyframes idxPulse { 50% { opacity: .25; } }

/* Цели дохода: кнопка в шапке финансов открывает окно-лесенку уровней */
.ig-btn { display: inline-flex; align-items: center; gap: 8px; }
.ig-btn svg { width: 16px; height: 16px; flex: none; }
.ig-btn .ig-mini { font-size: 12px; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; padding-left: 8px; border-left: 1px solid var(--line); }
dialog.ig { border: 1px solid var(--line); border-radius: 18px; padding: 0; width: min(680px, calc(100% - 32px)); max-height: min(90vh, 920px); background: var(--bg); color: var(--ink); box-shadow: 0 24px 60px rgba(10, 20, 16, .25); }
dialog.ig::backdrop { background: rgba(10, 18, 15, .45); backdrop-filter: blur(2px); }
.ig-in { padding: 20px; display: grid; gap: 16px; }
.ig-head { display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.ig-head h2 { font-family: var(--font-display); font-weight: 500; font-size: 22px; letter-spacing: -0.015em; }
.ig-head .sub { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
.ig-now { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.ig-now .tile { padding: 12px 14px; }
.ig-now .tile .v { font-size: 20px; }
.ig-track { position: relative; height: 54px; margin: 4px 10px 0; }
.ig-track .ln { position: absolute; left: 0; right: 0; top: 14px; height: 6px; border-radius: 999px; background: var(--line); }
.ig-track .fill { position: absolute; left: 0; top: 14px; height: 6px; border-radius: 999px; background: var(--accent); }
.ig-track .mk { position: absolute; top: 9px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); padding: 0; cursor: pointer; }
.ig-track .mk.ok { background: var(--accent); border-color: var(--accent); }
.ig-track .mk.cur { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.ig-track .lb { position: absolute; top: 32px; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.ig-track .lb.ok { color: var(--accent); font-weight: 600; }
.ig-track .you { position: absolute; top: -6px; width: 2px; height: 32px; margin-left: -1px; background: var(--ink); border-radius: 2px; }
.ig-track .you::after { content: attr(data-t); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); font-size: 11px; font-weight: 600; white-space: nowrap; background: var(--ink); color: var(--surface); padding: 1px 6px; border-radius: 6px; margin-bottom: 2px; }
.ig-ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.ig-ctl .scale .lbl b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ig-ctl input[type="range"] { width: 100%; accent-color: var(--accent); margin: 6px 0 0; }
.ig-list { display: grid; gap: 8px; }
.ig-lv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.ig-lv.ok { border-color: transparent; background: var(--accent-soft); }
.ig-lv.cur { border-color: var(--accent); }
.ig-lv > button { all: unset; box-sizing: border-box; width: 100%; cursor: pointer; display: grid; grid-template-columns: 28px 1fr auto; gap: 6px 12px; align-items: center; padding: 12px 14px; }
.ig-lv > button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; border-radius: 12px; }
.ig-lv .ck { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-content: center; font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.ig-lv.ok .ck { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.ig-lv.cur .ck { border-color: var(--accent); color: var(--accent); }
.ig-lv .amt { font-family: var(--font-display); font-weight: 500; font-size: 17px; font-variant-numeric: tabular-nums; }
.ig-lv .amt small { font-family: var(--font-body); font-size: 12.5px; color: var(--muted); font-weight: 400; margin-left: 4px; }
.ig-lv .pc { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.ig-lv.ok .pc { color: var(--accent); font-weight: 600; }
.ig-lv .bar { grid-column: 2 / 4; height: 6px; background: var(--bg); }
.ig-lv.ok .bar { background: var(--surface); }
.ig-lv .bar i.pas { background: var(--warn); }
.ig-lv .bars { grid-column: 2 / 4; display: grid; gap: 4px; }
.ig-lv .bars .bar { grid-column: auto; }
.ig-det { padding: 0 14px 14px 54px; display: grid; gap: 10px; }
.ig-det .row3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.ig-det .st { background: var(--bg); border-radius: 10px; padding: 9px 11px; display: grid; gap: 2px; }
.ig-lv.ok .ig-det .st { background: var(--surface); }
.ig-det .st .k { font-size: 12px; color: var(--muted); }
.ig-det .st .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.ig-det .st .t { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ig-det .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ig-add { display: flex; gap: 8px; flex-wrap: wrap; }
.ig-add input { flex: 1; min-width: 140px; border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; background: var(--surface); text-align: right; font-variant-numeric: tabular-nums; }
.ig-quick { display: flex; flex-wrap: wrap; gap: 6px; }
.ig-quick button { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--muted); cursor: pointer; font-variant-numeric: tabular-nums; }
.ig-quick button:hover { border-color: var(--accent); color: var(--accent); }
@media (max-width: 520px) {
  .ig-in { padding: 16px; }
  .ig-ctl { grid-template-columns: 1fr; }
  .ig-det { padding-left: 14px; }
  .ig-lv .amt small { display: none; }
  .ig-now { grid-template-columns: 1fr 1fr; }
  .ig-now .tile:last-child { grid-column: 1 / -1; }
  .ig-track .lb:nth-of-type(even) { top: 46px; }
}
@media (prefers-reduced-motion: no-preference) {
  dialog.ig[open] { animation: igIn .22s ease; }
  @keyframes igIn { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
  .ig-track .fill, .ig-track .you { transition: width .4s ease, left .4s ease; }
}

@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
@media (max-width: 420px) {
  .wrap { padding: 16px 16px 40px; }
  .note { grid-template-columns: 1fr; gap: 2px; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .4s ease; }
  .habit, .top-row, .task { transition: background-color .15s ease; }
}
</style>

</div>
<dialog class="ig" id="ig" aria-labelledby="ig-h"><div class="ig-in" id="ig-in"></div></dialog>

<script>
(() => {
  // ---------- План из «ОС Подснежник» ----------
  const QUARTER = { start: "2026-11-10", end: "2027-02-10", english: 60, workout: 33 };
  const ALL = [0,1,2,3,4,5,6];
  const HABITS = [
    { id: "english", name: "Английский", sub: "45 минут занятий", days: [1,2,3,4,5], metric: "englishMin", unit: "мин" },
    { id: "workout", name: "Тренировка", sub: "30–45 минут, утром до работы", days: [1,3,5] },
    { id: "sleep",   name: "Отбой в 23:00", sub: "вчера вечером", days: ALL },
    { id: "screen",  name: "Развлечения до 45 минут", sub: "YouTube, ленты, игры", days: ALL, metric: "funMin", unit: "мин" },
    { id: "finance", name: "Финансы горных проектов", sub: "2 часа: NPV, DCF, JORC", days: [6] },
    { id: "review",  name: "Пятничный разбор", sub: "отчёт из вкладки «Неделя» в чат", days: [5] },
  ];
  const LADDER = [
    { y: 2029, age: "28 лет", role: "Горный аналитик", det: "Первая роль на стороне инвестора, английский B2, доход от $4000 в месяц" },
    { y: 2031, age: "30 лет", role: "Старший аналитик", det: "Сам ведёт экспертизу проектов, английский C1, испанский B2" },
    { y: 2036, age: "35 лет", role: "Руководитель направления", det: "Глава горной аналитики или директор по инвестициям" },
    { y: 2041, age: "40 лет", role: "Партнёр", det: "Доля в фонде или своя консалтинговая компания" },
  ];

  // ---------- Даты ----------
  const pad = n => String(n).padStart(2, "0");
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
  const weekStart = s => addDays(s, -((parse(s).getDay() + 6) % 7));
  const todayIso = () => iso(new Date());
  const wd = s => parse(s).getDay();
  const fmtLong = s => { const t = new Intl.DateTimeFormat("ru-RU", { weekday: "long", day: "numeric", month: "long" }).format(parse(s)); return t[0].toUpperCase() + t.slice(1); };
  const fmtShort = s => new Intl.DateTimeFormat("ru-RU", { day: "numeric", month: "long" }).format(parse(s));
  const DOW = ["Вс", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
  const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
  const hm = min => { const h = Math.floor(min / 60), m = Math.round(min % 60); return h ? `${h} ч ${m} мин` : `${m} мин`; };
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const uid = () => Math.random().toString(36).slice(2, 9);

  // ---------- Состояние ----------
  let db = null, local = false;
  const days = {};
  const dirty = new Set();
  let cur = todayIso();
  let tab = "today";
  let saving = false, flushTimer = null;

  const blank = date => ({ date, top: [{ t: "", d: false }, { t: "", d: false }, { t: "", d: false }], tasks: [], habits: {}, englishMin: null, funMin: null, energy: 0, mood: 0, win: "", lesson: "", blocker: "", note: "" });
  const norm = (date, o) => {
    const b = blank(date);
    if (!o || typeof o !== "object") return b;
    const top = Array.isArray(o.top) ? o.top.slice(0, 3).map(x => ({ t: String(x?.t ?? ""), d: !!x?.d })) : b.top;
    while (top.length < 3) top.push({ t: "", d: false });
    return {
      date,
      top,
      tasks: Array.isArray(o.tasks) ? o.tasks.filter(x => x && typeof x.t === "string").map(x => ({ id: String(x.id || uid()), t: x.t, done: !!x.done, p: !!x.p, moved: !!x.moved })) : [],
      habits: o.habits && typeof o.habits === "object" ? Object.fromEntries(HABITS.map(h => [h.id, !!o.habits[h.id]])) : {},
      englishMin: Number.isFinite(o.englishMin) ? o.englishMin : null,
      funMin: Number.isFinite(o.funMin) ? o.funMin : null,
      energy: Number(o.energy) || 0, mood: Number(o.mood) || 0,
      win: String(o.win ?? ""), lesson: String(o.lesson ?? ""), blocker: String(o.blocker ?? ""), note: String(o.note ?? ""),
    };
  };
  const day = s => (days[s] ||= blank(s));
  const has = s => !!days[s];

  // ---------- Сохранение ----------
  const statusEl = document.getElementById("status");
  const setStatus = (s, text) => { statusEl.dataset.s = s; statusEl.textContent = text; };
  const LS = "podsnezhnik.v3";
  const GHK = "podsnezhnik.gh", FILE = "planner.json", MFILE = "market.json";
  let GH = null; try { GH = JSON.parse(localStorage.getItem(GHK) || "null"); if (!GH || !GH.owner || !GH.token) GH = null; else GH.repo = GH.repo || "podsnezhnik-data"; } catch { GH = null; }

  // Записи вводятся вручную и хранятся в закрытом репозитории (planner.json); котировки и дивиденды кладёт робот GitHub в market.json
  let holdings = [];
  let cash = { broker: null, hand: null };
  let gold = { g: null, avg: null };
  let quotes = null;
  const IG_OLD = [100000, 200000, 300000, 500000, 750000, 1000000].join();
  const IG_DEF = [25000, 50000, 100000, 200000, 300000, 500000, 1000000];
  let igoals = { levels: IG_DEF.slice(), period: 10, infl: 6, y: null, c: null };
  let idx = null, mc = null;
  const money = {};
  let sha = null, gen = 0, pushing = false, again = false;
  const isBlankDay = d => !d || (!d.tasks.length && !d.top.some(x => x.t || x.d) && !Object.values(d.habits).some(Boolean) && d.englishMin == null && d.funMin == null && !d.energy && !d.mood && !d.win && !d.lesson && !d.blocker && !d.note);
  const snapshot = () => ({ v: 1, updated: new Date().toISOString(), days: Object.fromEntries(Object.entries(days).filter(([, d]) => !isBlankDay(d))), holdings, cash, gold, igoals, money: Object.fromEntries(Object.entries(money).filter(([, m]) => m.inc.some(x => x.a != null) || m.log.length || Object.values(m.exp).some(v => v != null) || m.inv != null)) });
  const lsSave = () => { try { localStorage.setItem(LS, JSON.stringify({ ...snapshot(), quotes, sha, dirty: [...dirty] })); return true; } catch { return false; } };
  const lsLoad = () => { try { return JSON.parse(localStorage.getItem(LS) || "{}"); } catch { return {}; } };
  const normHold = items => Array.isArray(items) ? items.filter(h => h && typeof h.secid === "string").map(h => ({ secid: h.secid, kind: ["share", "bond", "gold"].includes(h.kind) ? h.kind : "share", qty: Number.isFinite(h.qty) ? h.qty : null, avg: Number.isFinite(h.avg) ? h.avg : null })) : [];
  const normMon = (k, o) => {
    const log = Array.isArray(o?.log) ? o.log.filter(x => x && Number.isFinite(x.a) && x.a > 0).map(x => ({ id: String(x.id || uid()), d: /^\d{4}-\d{2}-\d{2}$/.test(x.d) ? x.d : k + "-01", a: x.a, c: String(x.c || "Прочее"), t: String(x.t ?? "") })) : [];
    // Старые суммы по категориям превращаются в записи журнала
    if (o?.exp && typeof o.exp === "object") Object.entries(o.exp).forEach(([c, a]) => { if (Number.isFinite(a) && a > 0) log.push({ id: uid(), d: k + "-01", a, c, t: "итог месяца, внесён одной суммой" }); });
    return { month: k, inc: Array.isArray(o?.inc) ? o.inc.map(x => ({ id: String(x.id || uid()), t: String(x.t ?? ""), a: Number.isFinite(x.a) ? x.a : null })) : [], log, exp: {}, inv: Number.isFinite(o?.inv) ? o.inv : null };
  };
  function applyData(data) {
    if (!data || typeof data !== "object") return;
    Object.entries(data.days || {}).forEach(([k, v]) => { if (!dirty.has("days/" + k)) days[k] = norm(k, v); });
    if (!dirty.has("portfolio/holdings") && Array.isArray(data.holdings)) holdings = normHold(data.holdings);
    if (!dirty.has("gold") && data.gold && typeof data.gold === "object") gold = { g: Number.isFinite(data.gold.g) ? data.gold.g : null, avg: Number.isFinite(data.gold.avg) ? data.gold.avg : null };
    if (!dirty.has("cash") && data.cash && typeof data.cash === "object") cash = { broker: Number.isFinite(data.cash.broker) ? data.cash.broker : null, hand: Number.isFinite(data.cash.hand) ? data.cash.hand : null };
    Object.entries(data.money || {}).forEach(([k, v]) => { if (!dirty.has("money/" + k)) money[k] = normMon(k, v); });
    if (!dirty.has("igoals") && data.igoals && typeof data.igoals === "object") {
      const lv = Array.isArray(data.igoals.levels) ? [...new Set(data.igoals.levels.filter(x => Number.isFinite(x) && x > 0))].sort((a, b) => a - b) : IG_DEF.slice();
      const g = data.igoals, fin = (v, lo, hi) => Number.isFinite(v) && v >= lo && v <= hi ? v : null;
      igoals = { levels: lv.length && lv.join() !== IG_OLD ? lv : IG_DEF.slice(), period: [5, 10, 15].includes(g.period) ? g.period : 10, infl: fin(g.infl, 0, 30) ?? 6, y: g.period ? fin(g.y, 2, 20) : null, c: fin(g.c, 0, 1e9) };
    }
  }

  // ---------- GitHub ----------
  const ghHdr = () => ({ Authorization: "Bearer " + GH.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
  const ghUrl = f => `https://api.github.com/repos/${encodeURIComponent(GH.owner)}/${encodeURIComponent(GH.repo)}/contents/${f}`;
  const b64d = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g, "")), c => c.charCodeAt(0)));
  const b64e = s => { const b = new TextEncoder().encode(s); let r = ""; for (let i = 0; i < b.length; i += 0x8000) r += String.fromCharCode(...b.subarray(i, i + 0x8000)); return btoa(r); };
  function tfetch(u, o = {}, ms = 15000) {
    const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
    return fetch(u, { ...o, signal: c.signal }).catch(e => { throw new Error(e.name === "AbortError" ? "GitHub не ответил, проверьте интернет" : "нет связи с GitHub"); }).finally(() => clearTimeout(t));
  }
  async function ghRead(f) {
    const r = await tfetch(ghUrl(f) + "?t=" + Date.now(), { headers: ghHdr(), cache: "no-store" });
    if (r.status === 404) return { sha: null, data: null };
    if (r.status === 401) throw new Error("токен не подходит или истёк");
    if (!r.ok) throw new Error("GitHub ответил " + r.status);
    const j = await r.json();
    return { sha: j.sha, data: j.content ? JSON.parse(b64d(j.content)) : null };
  }
  async function pull() { const r = await ghRead(FILE); sha = r.sha; applyData(r.data); lsSave(); }
  async function push() {
    if (!GH) { dirty.clear(); lsSave() ? setStatus("ok", "Сохранено на этом устройстве") : setStatus("err", "Браузер не даёт сохранять"); return; }
    if (pushing) { again = true; return; }
    pushing = true; const g = gen;
    try {
      for (let i = 0; i < 3; i++) {
        const body = { message: "Подснежник: " + todayIso(), content: b64e(JSON.stringify(snapshot())) };
        if (sha) body.sha = sha;
        const r = await tfetch(ghUrl(FILE), { method: "PUT", headers: { ...ghHdr(), "Content-Type": "application/json" }, body: JSON.stringify(body) });
        if (r.ok) { sha = (await r.json()).content.sha; if (gen === g) dirty.clear(); break; }
        if (r.status === 409 || r.status === 422) { await pull(); if (i === 2) throw new Error("не удалось записать, попробуйте ещё раз"); continue; }
        if (r.status === 401) throw new Error("токен не подходит или истёк");
        throw new Error("GitHub ответил " + r.status);
      }
      lsSave();
      setStatus(dirty.size ? "busy" : "ok", dirty.size ? "Сохраняю…" : "Синхронизировано в " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }));
    } catch (e) { lsSave(); setStatus("err", "Нет синхронизации: " + e.message); }
    pushing = false;
    if (again || dirty.size) { again = false; clearTimeout(flushTimer); flushTimer = setTimeout(push, 2000); }
  }
  let lastSync = 0;
  async function sync(quiet) {
    if (!GH || pushing) return;
    lastSync = Date.now();
    try {
      await pull();
      if (dirty.size) await push(); else setStatus("ok", "Синхронизировано в " + new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }));
      if (quiet) softRender(); else render();
    } catch (e) { setStatus("err", "Нет синхронизации: " + e.message); }
  }
  function save(...dates) { savePath(...dates.map(d => "days/" + d)); }
  function savePath(...paths) {
    paths.forEach(p => dirty.add(p)); gen++;
    lsSave();
    setStatus("busy", "Сохраняю…");
    clearTimeout(flushTimer);
    flushTimer = setTimeout(push, 1500);
  }

  // ---------- Биржа ----------
  const ISS = "https://iss.moex.com/iss";
  let liveAt = 0;
  async function loadMarket() {
    if (!GH) return;
    try { const r = await ghRead(MFILE); if (r.data) { const live = quotes?.live ? quotes.q : null; quotes = r.data; if (live && liveAt) Object.assign(quotes.q, live), quotes.live = liveAt; lsSave(); softRender(); } } catch {}
  }
  async function livePrices() {
    const tk = [...new Set(holdings.filter(h => h.kind === "share").map(h => h.secid))];
    const hasGold = (Number(gold.g) || 0) > 0;
    if (!tk.length && !hasGold) return;
    try {
      const rows = b => b.data.map(r => Object.fromEntries(b.columns.map((c, i) => [c, r[i]])));
      const q = {};
      if (tk.length) {
        const x = await (await tfetch(`${ISS}/engines/stock/markets/shares/boards/TQBR/securities.json?iss.meta=off&iss.only=securities,marketdata&securities.columns=SECID,SHORTNAME,PREVPRICE&marketdata.columns=SECID,LAST,LCURRENTPRICE,MARKETPRICE&securities=${tk.join(",")}`, { cache: "no-store" })).json();
        const md = Object.fromEntries(rows(x.marketdata).map(r => [r.SECID, r]));
        for (const s of rows(x.securities)) { const m = md[s.SECID] || {}; const p = m.LAST ?? m.LCURRENTPRICE ?? m.MARKETPRICE ?? s.PREVPRICE; if (p > 0) q[s.SECID] = { n: s.SHORTNAME, p, pc: s.PREVPRICE, k: "share" }; }
      }
      if (hasGold) {

  const planned = (h, s) => h.days.includes(wd(s));
  function dayScore(s) {
    const d = days[s]; const pl = HABITS.filter(h => planned(h, s));
    const done = d ? pl.filter(h => d.habits[h.id]).length : 0;
    const tasks = d ? d.tasks.filter(t => !t.moved) : [];
    return { done, total: pl.length, tDone: tasks.filter(t => t.done).length, tTotal: tasks.length };
  }
  function weekStats(ws) {
    const list = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
    const c = id => list.filter(s => days[s]?.habits[id]).length;
    const sum = k => list.reduce((a, s) => a + (Number(days[s]?.[k]) || 0), 0);
    const tasks = list.flatMap(s => (days[s]?.tasks || []).filter(t => !t.moved));
    const en = list.map(s => days[s]?.energy).filter(Boolean);
    const funDays = list.filter(s => days[s] && days[s].funMin != null).length;
    return {
      list, workout: c("workout"), english: c("english"), sleep: c("sleep"), finance: c("finance"),
      enMin: sum("englishMin"), fun: sum("funMin"), funDays,
      tDone: tasks.filter(t => t.done).length, tTotal: tasks.length,
      energy: en.length ? en.reduce((a, b) => a + b, 0) / en.length : null,
    };
  }

      const val = p != null ? qty * p : null, cost = avg != null ? qty * avg : null;
      const dv = h.kind === "share" ? divInfo(h.secid, t) : { past: 0, fwd: 0, next: [] };
      return { i, h, q, qty, avg, p, pc, val, cost, pnl: val != null && cost != null ? val - cost : null, day: p != null && pc ? qty * (p - pc) : 0, dv };
    });
    const val = rows.reduce((a, r) => a + (r.val || 0), 0);
    const known = rows.filter(r => r.cost != null && r.val != null && r.qty > 0);
    const cost = known.reduce((a, r) => a + r.cost, 0), valKnown = known.reduce((a, r) => a + r.val, 0);
    const noAvg = rows.filter(r => r.qty > 0 && r.cost == null).length;
    const day = rows.reduce((a, r) => a + r.day, 0);
    const past = rows.reduce((a, r) => a + r.qty * r.dv.past, 0) * TAX;
    const fwd = rows.reduce((a, r) => a + r.qty * r.dv.fwd, 0) * TAX;
    const upcoming = rows.filter(r => r.qty > 0).flatMap(r => r.dv.next.map(x => ({ ...x, secid: r.h.secid, name: r.q?.n || r.h.secid, qty: r.qty }))).sort((a, b) => a.r < b.r ? -1 : 1).slice(0, 8);
    const cashB = Number(cash.broker) || 0, cashH = Number(cash.hand) || 0;
    const acct = val + cashB;
    const gq = quotes?.q?.GLDRUB_TOM, gg = Number(gold.g) || 0, gavg = Number(gold.avg) > 0 ? Number(gold.avg) : null;
    const G = { g: gg, p: gq?.p ?? null, pc: gq?.pc ?? null };
    G.val = G.p != null ? gg * G.p : null; G.cost = gavg != null ? gg * gavg : null;
    G.pnl = G.val != null && G.cost != null ? G.val - G.cost : null; G.day = G.p != null && G.pc ? gg * (G.p - G.pc) : 0;
    const outside = cashH + (G.val || 0);
    return { rows, val, cost, valKnown, noAvg, day, past, fwd, upcoming, cashB, cashH, acct, G, outside, all: acct + outside };
  }

    const today = m.log.filter(x => x.d === t).reduce((a, x) => a + x.a, 0);
    const dayN = isCur ? Number(t.slice(8, 10)) : new Date(+monthOf.slice(0, 4), +monthOf.slice(5, 7), 0).getDate();
    const list = m.log.filter(x => !spCat || x.c === spCat).sort((a, b) => a.d < b.d ? 1 : a.d > b.d ? -1 : 0);
    const shown = spMore ? list : list.slice(0, 12);

              <span>${esc(c)}</span><span class="s">${by[c].s ? rub(by[c].s) : "—"}${by[c].s && E ? `<small>${nf(by[c].s / E * 100, 0)} %</small>` : ""}</span>

  const MCK = "podsnezhnik.mcftr";

    else if (a === "mnext") { monthOf = ymAdd(monthOf, 1); render(); }
    else if (a === "inc-add") { mon(monthOf).inc.push({ id: uid(), t: "", a: null }); savePath("money/" + monthOf); render(); }
    else if (a === "inc-del") { const m = mon(monthOf); m.inc = m.inc.filter(x => x.id !== b.dataset.id); savePath("money/" + monthOf); render(); }
    else if (a === "copy") {
      const ta = document.getElementById("report");
      const done = () => { b.textContent = "Скопировано"; setTimeout(() => { b.textContent = "Скопировать отчёт"; }, 1800); };
      try { navigator.clipboard.writeText(ta.value).then(done, () => { ta.focus(); ta.select(); b.textContent = "Выделено, нажмите Ctrl+C"; }); }
      catch { ta.focus(); ta.select(); b.textContent = "Выделено, нажмите Ctrl+C"; }
    }
  });

  view.addEventListener("change", e => {
    const el = e.target, d = day(cur);
    if (el.dataset.habit) { d.habits[el.dataset.habit] = el.checked; save(cur); render(); }
    else if (el.dataset.taskCheck) { const t = d.tasks.find(x => x.id === el.dataset.taskCheck); if (t) { t.done = el.checked; save(cur); render(); } }
    else if (el.dataset.topCheck != null) { d.top[+el.dataset.topCheck].d = el.checked; save(cur); render(); }
    else if (el.dataset.hf || el.dataset.cash || el.dataset.gold || el.dataset.incA || el.dataset.exp || el.dataset.inv) { setTimeout(() => { if (!typing()) render(); else pendingRender = true; }, 0); }
  });

  view.addEventListener("input", e => {
    const el = e.target, d = day(cur);
    if (el.dataset.field) { d[el.dataset.field] = el.value; save(cur); }
    else if (el.dataset.topText != null) { d.top[+el.dataset.topText].t = el.value; save(cur); }
    else if (el.dataset.metric) {
      const k = el.dataset.metric, v = el.value === "" ? null : Math.max(0, Math.min(1440, Math.round(Number(el.value))));
      d[k] = Number.isFinite(v) ? v : null;
      if (k === "englishMin" && d[k] != null) setHabit("english", d[k] >= 45);
      if (k === "funMin" && d[k] != null) setHabit("screen", d[k] <= 45);
      save(cur);
    }
    else if (el.dataset.gold) {
      const v = el.value === "" ? null : Number(el.value);
      gold[el.dataset.gold] = Number.isFinite(v) && v >= 0 ? v : null;
      savePath("gold");
      if (el.dataset.gold === "g" && gold.g > 0 && !quotes?.q?.GLDRUB_TOM) livePrices();
    }
    else if (el.dataset.cash) {
      const v = el.value === "" ? null : Number(el.value);
      cash[el.dataset.cash] = Number.isFinite(v) && v >= 0 ? v : null;
      savePath("cash");
    }
    else if (el.dataset.hf) {
      const h = holdings[+el.dataset.i]; if (!h) return;
      const v = el.value === "" ? null : Number(el.value);
      h[el.dataset.hf] = Number.isFinite(v) && v >= 0 ? v : null;
      savePath("portfolio/holdings");
    }
    else if (el.dataset.incT || el.dataset.incA) {
      const m = mon(monthOf), x = m.inc.find(y => y.id === (el.dataset.incT || el.dataset.incA)); if (!x) return;
      if (el.dataset.incT) x.t = el.value; else { const v = el.value === "" ? null : Number(el.value); x.a = Number.isFinite(v) && v >= 0 ? v : null; }
      savePath("money/" + monthOf);
    }
    else if (el.dataset.exp || el.dataset.inv) {
      const m = mon(monthOf), v = el.value === "" ? null : Number(el.value), ok = Number.isFinite(v) && v >= 0 ? v : null;
      if (el.dataset.exp) m.exp[el.dataset.exp] = ok; else m.inv = ok;
      savePath("money/" + monthOf);
    }
  });
  function setHabit(id, on) {
    const d = day(cur); d.habits[id] = on;
    const box = document.getElementById("h-" + id);
    if (box) { box.checked = on; box.closest(".habit").classList.toggle("done", on); }
  }

  view.addEventListener("submit", e => {
    if (e.target.dataset.form === "gh") { e.preventDefault(); ghConnect(); return; }
    if (e.target.dataset.form === "spend") {
      e.preventDefault();
      const inp = document.getElementById("sp-amt"), a = Math.round(Number(String(inp.value).replace(",", ".")) * 100) / 100;
      if (!(a > 0)) { inp.focus(); return; }
      const c = document.getElementById("sp-cat").value, t = document.getElementById("sp-note").value.trim();
      let d = document.getElementById("sp-date").value; if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) d = todayIso();
      const ym = d.slice(0, 7), id = uid();
      mon(ym).log.push({ id, d, a, c, t });
      spLastCat = c; try { localStorage.setItem("podsnezhnik.lastcat", c); } catch {}
      spNew = id; monthOf = ym;
      savePath("money/" + ym); render();
      const again = document.getElementById("sp-amt"); if (again) again.focus({ preventScroll: true });
      setTimeout(() => { spNew = null; }, 1500);
      return;
    }
    if (e.target.dataset.form === "hold") {
      e.preventDefault();
      const inp = document.getElementById("new-secid"), kind = document.getElementById("new-kind").value;
      const secid = kind === "gold" ? "GLDRUB_TOM" : inp.value.trim().toUpperCase().replace(/[^A-Z0-9_.-]/g, "");
      if (!secid) { inp.focus(); return; }
      if (holdings.some(h => h.secid === secid)) { inp.value = ""; return; }
      holdings.push({ secid, kind, qty: null, avg: null });
      savePath("portfolio/holdings"); render();
      return;
    }
    if (e.target.dataset.form !== "task") return;
    e.preventDefault();
    const inp = document.getElementById("new-task"), t = inp.value.trim();
    if (!t) return;
    day(cur).tasks.push({ id: uid(), t, done: false, p: false, moved: false });
    save(cur); render();
    const again = document.getElementById("new-task"); if (again) again.focus();
  });

  // ---------- Вкладки ----------
  function route() {
    const h = location.hash.slice(1);
    tab = ["today", "week", "goals", "money", "sync"].includes(h) ? h : "today";
    render();
  }
  window.addEventListener("hashchange", route);

  // ---------- Загрузка ----------
  const banner = document.getElementById("banner");
  {
    const c = lsLoad();
    applyData(c);
    if (c.quotes) quotes = c.quotes;
    if (c.sha) sha = c.sha;
    (c.dirty || []).forEach(p => dirty.add(p));
  }
  route();
  statusEl.style.cursor = "pointer"; statusEl.title = "Синхронизация";
  statusEl.addEventListener("click", () => { location.hash = "sync"; });
  if (!GH) {
    banner.hidden = false;
    banner.innerHTML = 'Записи сейчас хранятся только в этом браузере. <a href="#sync">Подключите GitHub</a>, чтобы они были на всех устройствах.';
    setStatus("ok", "На этом устройстве");
    livePrices();
  } else {
    setStatus("busy", "Синхронизирую…");
    sync(false).then(() => { loadMarket(); livePrices(); });
  }
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { if (Date.now() - lastSync > 15000) sync(true); if (Date.now() - liveAt > 30 * 60e3) { loadMarket(); livePrices(); } }
    else if (dirty.size) { clearTimeout(flushTimer); push(); }
  });
  addEventListener("online", () => sync(true));
  setInterval(() => { if (document.visibilityState === "visible") sync(true); }, 60e3);
  setInterval(() => { if (document.visibilityState === "visible" && tab === "money") livePrices(); }, 5 * 60e3);
  loadIdx(); setInterval(() => { if (document.visibilityState === "visible" && tab === "money") loadIdx(); }, 30e3);

  // Переход на новый день, если страница открыта с вечера
  let lastToday = todayIso();
  setInterval(() => { const t = todayIso(); if (t !== lastToday) { if (cur === lastToday) cur = t; lastToday = t; softRender(); } }, 60000);
})();
</script>
</body>
</html>
